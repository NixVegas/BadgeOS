# Reset a hung SG2000 (console dead, chip still powered) through its watchdog, over the
# A53's SWD port as in a53.cfg. The pad mux survives a warm reset, so this works as long
# as Linux or U-Boot set it up before the badge hung.
#
#   openocd -f badge/wdt-reset.cfg                  read the watchdog and RTC_EN_WDT_RST_REQ
#   openocd -c "set FIRE 1" -f badge/wdt-reset.cfg  reset the SoC
#
# The dw_wdt at 0x03010000 raises a reset request with RMOD=0, and the FSBL's
# RTC_EN_WDT_RST_REQ at 0x050260E0 turns it into a chip reset; it has to read 1.

adapter driver ch347
transport select swd
adapter speed 6000
gdb port disabled
tcl port disabled
telnet port disabled
reset_config none

swd newdap a53 cpu
dap create a53.dap -chain-position a53.cpu

# Physical memory only: no core target, so nothing waits on a halt.
target create a53.axi mem_ap -dap a53.dap -ap-num 1

init

echo "\n### watchdog and RTC_EN_WDT_RST_REQ ###"
foreach {name addr} {WDT_CR 0x03010000 WDT_TORR 0x03010004 WDT_CCVR 0x03010008 WDT_STAT 0x03010010} {
    if {[catch {set v [lindex [read_memory $addr 32 1] 0]} e]} {
        echo "  $name read FAILED ($e)"
    } else {
        echo [format "  %-9s %s = 0x%08x" $name $addr $v]
    }
}
if {[catch {set g [lindex [read_memory 0x050260E0 32 1] 0]} e]} {
    echo "  RTC_EN_WDT_RST_REQ read FAILED ($e)"
} else {
    echo [format "  RTC_EN_WDT_RST_REQ 0x050260E0 = 0x%08x  (must be 1 for a chip reset)" $g]
}

if {[info exists FIRE]} {
    echo "\n### arming the watchdog for an immediate reset ###"
    catch {write_memory 0x050260E0 32 [list 1]}
    write_memory 0x03010004 32 [list 0x00000000]   ;# TOP = shortest period
    write_memory 0x0301000C 32 [list 0x00000076]   ;# restart the counter
    write_memory 0x03010000 32 [list 0x00000001]   ;# EN, RMOD=0: system reset
    echo "  armed; the SoC resets through the mask ROM."
}
shutdown
