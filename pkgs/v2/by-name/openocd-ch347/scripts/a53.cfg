# The Cortex-A53 over the SG2000's two-wire debug port, which is ARM SWD. Needs the
# MIPI_TX_1 pads muxed to it and wired to the CH347 (see the SoM page of the docs).

adapter driver ch347
transport select swd
adapter speed 6000
reset_config none

swd newdap a53 cpu
dap create a53.dap -chain-position a53.cpu

cti create a53.cti -dap a53.dap -ap-num 0 -baseaddr 0x81020000
target create a53.cpu aarch64 -dap a53.dap -ap-num 0 -dbgbase 0x81010000 -cti a53.cti

# AP1 reads and writes physical memory without halting the core.
target create a53.axi mem_ap -dap a53.dap -ap-num 1
