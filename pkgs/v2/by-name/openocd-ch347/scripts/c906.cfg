# The RISC-V C906 over the CH347's four-wire JTAG. It only answers while the badge is
# booted on the RISC-V core; if examining it fails, retry or lower the adapter speed.

adapter driver ch347
adapter speed 1000
transport select jtag
reset_config none

jtag newtap c906 cpu -irlen 5 -expected-id 0x10000b6f
target create c906.cpu riscv -chain-position c906.cpu
