# Builds the documentation site (nix build .#docs) and publishes it with GitHub Pages.
# Needs Settings -> Pages -> Source: GitHub Actions.
name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build the site
        run: nix build --print-build-logs .#docs

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: result

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
